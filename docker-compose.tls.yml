services:
  lb:
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/tls.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_CERT_DIR:?Set TLS_CERT_DIR to the directory containing fullchain.pem and privkey.pem}:/etc/nginx/certs:ro

  loadgen:
    environment:
      TARGET: http://app:8000